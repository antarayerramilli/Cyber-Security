[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "openballot"
version = "0.2.1"
description = "Lightweight decentralized cryptographic voting node"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "OpenBallot Contributors", email = "dev@openballot.org" }
]
dependencies = [
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "requests>=2.28.0",
]

[project.scripts]
openballot = "openballot.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
